interface:
  display_name: "Code Change Review"
  short_description: "Reviews a PR, commit, or diff"
  default_prompt: "Use $code-change-review for this task: Reviews a PR, commit, or diff when asked to \"review this PR\", \"check my changes\", or find regressions; reports actionable findings rather than silently modifying code."
policy:
  allow_implicit_invocation: true
