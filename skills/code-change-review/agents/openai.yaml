interface:
  display_name: "Code Change Review"
  short_description: "Reviews supplied diffs and code snippets"
  default_prompt: "Use $code-change-review for this task: Reviews a supplied PR diff, commit, or code snippet when asked to \\\"review this PR\\\", check changes, or find bugs and regressions; covers static review without a checkout and returns findings without editing code."
policy:
  allow_implicit_invocation: true
