name: Validate portable skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: Install hash-locked validation tools
        run: "python3 -m pip install --require-hashes --only-binary=:all: -r requirements-ci-linux.txt"
      - name: Validate GitHub Actions workflow syntax
        run: python3 scripts/check_workflows.py
      - name: Run static type and lint checks
        run: |
          python3 -m mypy --strict scripts tests
          python3 -m ruff check scripts tests
      - name: Check tracked client distributions without rewriting them
        run: python3 scripts/build_distributions.py --check
      - name: Package Claude.ai skills
        run: python3 scripts/package_claude_ai.py
      - name: Validate catalog and generated drift
        run: python3 scripts/validate.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
