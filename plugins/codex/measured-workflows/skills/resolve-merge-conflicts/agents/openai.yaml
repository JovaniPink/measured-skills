interface:
  display_name: "Resolve merge conflicts"
  short_description: "Resolves a named Git conflict"
  default_prompt: "Use $measured-workflows:resolve-merge-conflicts for this task: Resolves a named Git conflict when explicitly asked to reconcile a merge, rebase, or cherry-pick; preserves both intents and keeps continuation, commit, and push authority separate."
policy:
  allow_implicit_invocation: false
